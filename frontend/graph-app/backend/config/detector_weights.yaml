weights:               # renormalised over signals available for each entry
  volume: 0.20
  direction: 0.10
  novelty: 0.20
  timing: 0.10
  graph: 0.10
  isolation_forest: 0.20
  dns: 0.10

context_multipliers:
  allowlisted: 0.3
  scheduled: 0.5
  allowlisted_and_scheduled: 0.15   # replaces (not multiplies) the two above
  tier3_asset: 1.2

case:
  daily_floor: 20          # C(t) = decay*C(t-1) + max(0, daily - floor)
  decay: 0.8
  open_cumulative: 40
  open_single_day: 70
  tiers: {low: 40, medium: 60, high: 80}
  close_below: 10          # case goes dormant when score stays < 10 ...
  close_after_days: 7      # ... for this many days
  cusum_open_min_rarity: 0.5
  cusum_open_min_bytes: 1000000
  temporal_bonus_max: 15   # added to daily risk on CUSUM alarm (full system only)

temporal:
  cusum_k: 0.5
  cusum_h: 5.0             # in units of sigma (log-byte domain, standardised)
  cusum_cap: 10.0
  ewma_alpha: 0.3
  sigma_floor: 0.75
  reference_window_days: 28
  reference_min_obs: 10

isolation_forest:
  n_estimators: 300
  max_samples: 256
  contamination: auto
  random_state: 42
  percentile_floor: 0.90
  features:
    - log_bytes_out
    - log_bytes_in
    - log_out_in_ratio
    - n_conn
    - is_new
    - dest_age_days
    - peer_rarity
    - cat_prior
    - log_bytes_7d
    - cusum
    - offhours_share
    - mean_out_pkt
    - mean_in_pkt
    - z_user_self
    - z_user_peer
    - upload_heavy_flows
    - iat_cv
    - hidden_sni_share

subscores:
  z_offset: 1.0            # clip((z - 1) / 4, 0, 1)
  z_range: 4.0
  direction_log10_offset: 0.7
  direction_log10_range: 1.5
  offhours_offset: 0.3
  offhours_range: 0.6
  periodicity_offset: 0.3
  periodicity_range: 0.4
  dns_log10_offset: 1.7
  dns_log10_range: 1.3
  dns_entropy_offset: 3.3
  dns_entropy_range: 0.9

confidence:
  start: 1.0
  few_clean_days_lt14: 0.15
  very_few_clean_days_lt7: 0.30
  hidden_sni_share_gt50: 0.10
  dns_unavailable: 0.05
  poor_capture_lt090: 0.10
  identity_uncertain_lt080: 0.15
  tls_fp_missing: 0.05
  levels: {high: 0.80, medium: 0.60}

m0_threshold_bytes: 500000000
