version: "1.0.0"
# Feature catalogue. level: user_day | pair_day. priority: P0 / P1 / ctx (context & data quality).
# Every feature uses TRAILING history only; missing values are kept as NaN with explicit flags.
features:
  - {id: F01, name: out_bytes, level: [user_day, pair_day], priority: P0, desc: "Daily outbound (originator) bytes"}
  - {id: F02, name: out_in_ratio, level: [user_day, pair_day], priority: P0, desc: "Outbound / inbound byte ratio"}
  - {id: F03, name: z_self, level: [user_day, pair_day], priority: P0, desc: "Robust z of outbound bytes vs own trailing 14 clean days"}
  - {id: F04, name: z_peer, level: [user_day, pair_day], priority: P0, desc: "Robust z vs pooled peer-group trailing baseline"}
  - {id: F05, name: upload_heavy_flows, level: [user_day, pair_day], priority: P0, desc: "Upload-heavy flow count"}
  - {id: F08, name: cum7_out_bytes, level: [user_day], priority: P0, desc: "7-day cumulative outbound bytes"}
  - {id: F09, name: is_new, level: [pair_day], priority: P0, desc: "Destination recently first-seen for this user"}
  - {id: F10, name: dest_age_days, level: [pair_day], priority: P0, desc: "Days since first contact"}
  - {id: F11, name: bytes_new_dests, level: [user_day], priority: P0, desc: "Outbound bytes to new destinations"}
  - {id: F12, name: peer_rarity, level: [pair_day], priority: P0, desc: "1 - fraction of peers contacting destination (14d)"}
