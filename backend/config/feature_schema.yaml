  - {id: C1, name: allowlisted, level: [pair_day], priority: ctx, desc: "Destination allowlisted by policy"}
  - {id: C2, name: scheduled, level: [pair_day], priority: ctx, desc: "Transfers inside a registered scheduled window"}
  - {id: C3, name: asset_tier, level: [user_day], priority: ctx, desc: "Asset tier (1-3)"}
  - {id: C4, name: n_clean_days, level: [user_day], priority: ctx, desc: "Clean baseline days available"}
  - {id: C5, name: identity_confidence, level: [user_day], priority: ctx, desc: "Mean identity confidence"}
  - {id: C6, name: capture_quality, level: [user_day], priority: ctx, desc: "Mean capture quality"}
missingness_flags: [m_sni, m_ja3, m_dns, m_baseline]
forbidden_in_features: [label, scenario, scenario_id, scenario_type, is_malicious, ground_truth, attack]
