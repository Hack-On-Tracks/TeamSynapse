  - {id: F27, name: mean_out_pkt, level: [user_day, pair_day], priority: P0, desc: "Mean outbound packet size"}
  - {id: F27b, name: mean_in_pkt, level: [user_day, pair_day], priority: P0, desc: "Mean inbound packet size"}
  - {id: F28, name: upload_like_starts, level: [user_day, pair_day], priority: P0, desc: "Flows whose shape looks like an upload start"}
  - {id: F31, name: ja3_novel_share, level: [user_day, pair_day], priority: P0, desc: "Share of flows with TLS fingerprint new to the user"}
  - {id: F32, name: hidden_sni_share, level: [user_day, pair_day], priority: P0, desc: "Share of flows without visible SNI"}
  - {id: F34, name: dns_max_hourly_queries, level: [user_day], priority: P0, desc: "Max hourly DNS query count"}
