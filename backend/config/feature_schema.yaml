  - {id: F18, name: bytes_7d, level: [pair_day], priority: P0, desc: "7-day bytes to one destination"}
  - {id: F19, name: cusum, level: [pair_day], priority: P0, desc: "CUSUM score per user-destination pair"}
  - {id: F20, name: offhours_share, level: [user_day, pair_day], priority: P0, desc: "Share of outbound bytes outside group work hours"}
  - {id: F21, name: hourly_divergence, level: [user_day], priority: P0, desc: "Jensen-Shannon divergence vs own hourly profile"}
  - {id: F23, name: periodicity, level: [pair_day], priority: P0, desc: "FFT periodicity strength on 168h series (>=6 flows)"}
