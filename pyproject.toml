[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphersentinel"
version = "0.1.0"
description = "AI‑powered insider threat detection platform"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSES.md"}
authors = [{name = "CipherSentinel Team", email = "team@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "duckdb>=1.0.0",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.8.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "requests>=2.32.3",
    "matplotlib>=3.8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
